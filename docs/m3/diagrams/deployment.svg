<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1060 520' width='1060' height='520'><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker><marker id='arrS' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><text x='530' y='24' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Production deployment view (proposed; nothing is deployed for M3)</text><rect x='20' y='46' width='700' height='456' rx='10' fill='none' stroke='#0f766e' stroke-width='1.6'/><text x='32' y='64' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#0f766e' text-anchor='start'>Meridian cloud account (private network, one region)</text><rect x='40' y='80' width='200' height='78' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='140.0' y='97' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Review web app</text><text x='140.0' y='112' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>container, 1 replica</text><text x='140.0' y='125' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>SSO login; supervisor +</text><text x='140.0' y='138' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>AR manager roles</text><rect x='260' y='80' width='210' height='78' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='365.0' y='97' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Event intake API</text><text x='365.0' y='112' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>container; webhook + form</text><text x='365.0' y='125' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>posts; writes event row</text><text x='365.0' y='138' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>then enqueues</text><rect x='490' y='80' width='210' height='78' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='595.0' y='97' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Scheduler</text><text x='595.0' y='112' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>cron: period close (day 1),</text><text x='595.0' y='125' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>timer.tick every 15 min,</text><text x='595.0' y='138' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>reconcile held commits</text><rect x='40' y='190' width='320' height='92' rx='6' fill='#ffffff' stroke='#1f2937' stroke-width='1.4'/><text x='200.0' y='207' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#1f2937' text-anchor='middle'>Orchestrator workers (2 containers)</text><text x='200.0' y='222' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>same code as the prototype: phases, checkpoint</text><text x='200.0' y='235' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>after each project, lease per run; agent calls</text><text x='200.0' y='248' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>go through the model gateway</text><rect x='380' y='190' width='320' height='92' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='540.0' y='207' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Model gateway</text><text x='540.0' y='222' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>holds the API key, logs tokens and cost per</text><text x='540.0' y='235' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>run_id, enforces monthly budget and</text><text x='540.0' y='248' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>timeouts (60 s) / retries (3)</text><rect x='40' y='316' width='320' height='92' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='200.0' y='333' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Managed PostgreSQL (SQLite today)</text><text x='200.0' y='348' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>same tables as the prototype: runs, review_items,</text><text x='200.0' y='361' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>events, invoice_commits, execution_log;</text><text x='200.0' y='374' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>point-in-time recovery, 7-year retention</text><rect x='380' y='316' width='320' height='92' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='540.0' y='333' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Logs + metrics</text><text x='540.0' y='348' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>structured JSON logs (run_id, event_id,</text><text x='540.0' y='361' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>idempotency_key), dashboards and alerts</text><text x='540.0' y='374' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>on stuck reviews and held commits</text><rect x='40' y='430' width='320' height='56' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='200.0' y='447' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Object storage</text><text x='200.0' y='462' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>source extracts per period, contract PDFs, exports</text><rect x='380' y='430' width='320' height='56' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='2 3'/><text x='540.0' y='447' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' fill='#6b7280' text-anchor='middle'>Vector index (Chroma) on the worker</text><text x='540.0' y='462' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#6b7280' text-anchor='middle'>contract clauses per client</text><rect x='740' y='46' width='300' height='456' rx='10' fill='none' stroke='#94a3b8' stroke-width='1.6' stroke-dasharray='8 5'/><text x='752' y='64' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' fill='#94a3b8' text-anchor='s